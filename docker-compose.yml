version: '3'
services:
  merchandising-hub:
    build:
      context: .
      target: runner
    ports:
      - '3000:3000'
    environment:
      MERCHANDISING_API_BASEURL: ${MERCHANDISING_API_BASEURL}
      MERCHANDISING_API_APIGEE_KEY: ${MERCHANDISING_API_APIGEE_KEY}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
