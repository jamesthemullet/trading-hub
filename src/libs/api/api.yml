        Returns the Global facets, if a categoryId is passed includes facets related to that category,
      parameters:
        - $ref: '#/components/parameters/catalogueParam'
        - in: query
          name: categoryId
          schema:
            type: array
            items:
              type: string
          required: false
          description: When provided will only return facets relevant to the queries related to this Rule Set, as well as configuration related to the provided Rule Set, such as if the facet is included or not
        - in: query
          name: searchTerm
          schema:
            type: array
            items:
              type: string
          required: false
          description: When provided will only return facets with at least one of the search terms in the display name
