        values:
          type: array
          items:
            type: string
      required:
        - property
        - values
    MerchandisingRulesWithInfo:
      type: object
      properties:
        pinnedProducts:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PinnedProduct'
              - $ref: '#/components/schemas/Product'
        blockedProducts:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/BlockedProduct'
              - $ref: '#/components/schemas/Product'
        boosts:
          $ref: '#/components/schemas/BoostsBuriesWithInfo'
        buries:
          $ref: '#/components/schemas/BoostsBuriesWithInfo'
        includes:
          $ref: '#/components/schemas/IncludesExcludes'
        excludes:
          $ref: '#/components/schemas/IncludesExcludes'
      required:
        - pinnedProducts
        - boosts
        - buries
    MerchandisingRules:
      type: object
      properties:
        pinnedProducts:
          type: array
          items:
            $ref: '#/components/schemas/PinnedProduct'
        blockedProducts:
          type: array
          items:
            $ref: '#/components/schemas/BlockedProduct'
        boosts:
          $ref: '#/components/schemas/BoostsBuries'
        buries:
          $ref: '#/components/schemas/BoostsBuries'
        includes:
          $ref: '#/components/schemas/IncludesExcludes'
        excludes:
          $ref: '#/components/schemas/IncludesExcludes'
      required:
        - pinnedProducts
        - blockedProducts
        - boosts
        - buries
        - includes
        - excludes
    PinnedProduct:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    BlockedProduct:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    IncludesExcludes:
      type: object
      properties:
        alphanumeric:
          type: array
          items:
            $ref: '#/components/schemas/IncludeExclude'
    BoostsBuries:
      type: object
      properties:
        numeric:
          type: array
          items:
            $ref: '#/components/schemas/NumericBoostBury'
        alphanumeric:
          type: array
          items:
            $ref: '#/components/schemas/AlphanumericBoostBury'
        product:
          type: array
          items:
            $ref: '#/components/schemas/ProductBoostBury'
      required:
        - numeric
        - alphanumeric
        - product
    BoostsBuriesWithInfo:
      type: object
      properties:
        numeric:
          type: array
          items:
            $ref: '#/components/schemas/NumericBoostBury'
        alphanumeric:
          type: array
          items:
            $ref: '#/components/schemas/AlphanumericBoostBury'
        product:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ProductBoostBury'
              - $ref: '#/components/schemas/Product'
      required:
        - numeric
        - alphanumeric
        - product
    ProductBoostBury:
      type: object
      properties:
        id:
          type: string
        weight:
          type: number
          format: double
      required:
        - id
        - weight
    NumericBoostBury:
      type: object
      properties:
        field:
          type: string
        weight:
          type: number
          format: double
      required:
        - field
        - weight
    AlphanumericBoostBury:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/AlphanumericBoostBuryField'
        weight:
          type: number
          format: double
      required:
        - fields
        - weight
    AlphanumericBoostBuryField:
      type: object
      properties:
        field:
          type: string
        values:
          type: array
          items:
            type: string
      required:
        - field
        - values
    IncludeExclude:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/AlphanumericBoostBuryField'
      required:
        - fields
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status
        - message
