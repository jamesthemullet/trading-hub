components:
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RuleSetFacetConfigWithId:
      allOf:
        - type: object
          properties:
            id:
              type: string
          required:
            - id
        - $ref: '#/components/schemas/RuleSetFacetConfig'
    RuleSetFacetConfig:
      type: object
      properties:
        excludedValues:
          type: array
          items:
            type: string
          description: Values of this attribute that should not be displayed as filters to the customers
        boosted:
          type: array
          items:
            type: string
          description: Array of values (in order) that should appear at the top of the list of filters. Un specified values will appear after these and be in order of most matching documents.
    GlobalOnlyFacetConfig:
      type: object
      properties:
        # Will be added later
        # influence:
        #   type: string
        indexPropertyName:
          type: string
          description: The field of the indexed document
        displayValue:
          type: string
          description: The value displayed to customers
        merged:
          type: array
          items:
            type: object
            properties:
              displayValue:
                type: string
              mergedValues:
                type: array
                items:
                  type: string
                description: The values (case insensitive) that will be mapped to be displayed as the `displayValue`
          description: Array of objects, each of which describe a set of values that will be merged in to one when displayed to customers.
      required:
        - displayValue
        - indexPropertyName
    AttributeValuesResponse:
      type: object
      properties:
        values:
          type: array
          items:
            type: object
            properties:
              displayValue:
                type: string
              mergedValues:
                type: array
                items:
                  type: string
              isExcluded:
                type: boolean
              isPinned:
                type: boolean
            required:
              - displayValue
              - isExcluded
              - isPinned
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - ruleSets
        - values
    GlobalRuleSets:
      type: object
      properties:
        ruleSets:
          type: array
          items:
            $ref: '#/components/schemas/ReturnedGlobalRuleSet'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - ruleSets
        - pagination
    CategoryRuleSets:
      type: object
      properties:
        ruleSets:
          type: array
          items:
            $ref: '#/components/schemas/ReturnedCategoryRuleSet'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - ruleSets
        - pagination
    CategoryRuleSet:
      allOf:
        - $ref: '#/components/schemas/RuleSet'
        - type: object
          properties:
            categoryId:
              type: string
          required:
            - categoryId

    RuleSet:
      type: object
      properties:
        isEnabled:
          type: boolean
        rules:
          $ref: '#/components/schemas/MerchandisingRules'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/RuleSetFacetConfigWithId'
          description: An array of the facets to display for these categories, optionally overriding config such as excludes and boosts.
      required:
        - rules
        - isEnabled
    ReturnedCategoryRuleSet:
      allOf:
        - $ref: '#/components/schemas/CategoryRuleSet'
        - type: object
          properties:
            categoryName:
              type: string
            id:
              type: string
            lastChanged:
              type: object
              properties:
                date:
                  type: string
                  format: date-time
                user:
                  type: string
              required:
                - date
                - user
          required:
            - id
            - categoryName
            - lastChanged
    ReturnedRuleSet:
      deprecated: true
      allOf:
        - $ref: '#/components/schemas/ReturnedCategoryRuleSet'
    ReturnedGlobalRuleSet:
      allOf:
        - $ref: '#/components/schemas/RuleSet'
        - type: object
          properties:
            id:
              type: string
            lastChanged:
              type: object
              properties:
                date:
                  type: string
                  format: date-time
                user:
                  type: string
              required:
                - date
                - user
          required:
            - id
            - lastChanged
    ReturnedRuleSetNotFound:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - message
        - status
    FacetsList:
      type: object
      properties:
        facets:
          type: array
          items:
            $ref: '#/components/schemas/ReturnedGlobalFacet'
      required:
        - facets
    FacetConfig:
      type: object
      allOf:
        - $ref: '#/components/schemas/RuleSetFacetConfig'
        - $ref: '#/components/schemas/GlobalOnlyFacetConfig'
    ReturnedGlobalFacet:
      type: object
      allOf:
        - $ref: '#/components/schemas/GlobalOnlyFacetConfig'
        - $ref: '#/components/schemas/RuleSetFacetConfig'
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: ['included', 'excluded']
            lastChanged:
              type: object
              properties:
                date:
                  type: string
                  format: date-time
                user:
                  type: string
              required:
                - date
                - user
          required:
            - id
            - lastChanged
    ReturnedRuleSetFacet:
      type: object
      allOf:
        - $ref: '#/components/schemas/RuleSetFacetConfig'
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: ['included', 'excluded']
            indexPropertyName:
              type: string
              description: The field of the indexed document
            displayValue:
              type: string
              description: The value displayed to customers
            lastChanged:
              type: object
              properties:
                date:
                  type: string
                  format: date-time
                user:
                  type: string
              required:
                - date
                - user
          required:
            - id
            - lastChanged
            - displayValue
            - indexPropertyName
    ReturnedFacet:
      oneOf:
        - $ref: '#/components/schemas/ReturnedGlobalFacet'
        - $ref: '#/components/schemas/ReturnedRuleSetFacet'
    SearchPreviewResponse:
      type: object
      properties:
        category:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        rules:
          $ref: '#/components/schemas/MerchandisingRulesWithInfo'
        facets:
          $ref: '#/components/schemas/Facets'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - products
        - category
        - rules
        - facets
        - pagination
    SearchPreviewResponseBeta:
      allOf:
        - $ref: '#/components/schemas/Facets'
        - type: object
          properties:
            category:
              type: string
            products:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            ruleSet:
              type: object
              properties:
                rules:
                  $ref: '#/components/schemas/MerchandisingRulesWithInfo'
                facets:
                  type: array
                  items:
                    $ref: '#/components/schemas/RuleSetFacetConfigWithId'
                  description: An array of the facets to display for these categories, optionally overriding config such as excludes and boosts.
              required:
                - rules
                - facets
            externalChanges:
              $ref: '#/components/schemas/MerchandisingRulesWithInfo'
            pagination:
              $ref: '#/components/schemas/Pagination'
          required:
            - products
            - category
            - ruleSet
            - facets
            - externalChanges
            - pagination
    ProductSearchResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - products
        - pagination
    Product:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        metadata:
          $ref: '#/components/schemas/ProductMetadata'
        url:
          type: string
        price:
          type: string
        imageUrl:
          type: array
          items:
            type: string
        title:
          type: string
        brand:
          type: string
        isInStock:
          type: boolean
      required:
        - id
        - productId
        - metadata
        - price
        - imageUrl
        - title
        - isInStock
    ProductMetadata:
      type: object
      properties:
        isPinned:
          type: boolean
        isBoosted:
          type: boolean
        isBuried:
          type: boolean
        isBlocked:
          type: boolean
      required:
        - isPinned
    MerchandisingRulesWithInfo:
      type: object
      properties:
        pinnedProducts:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PinnedProduct'
              - $ref: '#/components/schemas/Product'
        blockedProducts:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/BlockedProduct'
              - $ref: '#/components/schemas/Product'
        boosts:
          $ref: '#/components/schemas/BoostsBuriesWithInfo'
        buries:
          $ref: '#/components/schemas/BoostsBuriesWithInfo'
      required:
        - pinnedProducts
        - boosts
        - buries
    MerchandisingRules:
      type: object
      properties:
        pinnedProducts:
          type: array
          items:
            $ref: '#/components/schemas/PinnedProduct'
        blockedProducts:
          type: array
          items:
            $ref: '#/components/schemas/BlockedProduct'
        boosts:
          $ref: '#/components/schemas/BoostsBuries'
        buries:
          $ref: '#/components/schemas/BoostsBuries'
      required:
        - pinnedProducts
        - blockedProducts
        - boosts
        - buries
    PinnedProduct:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    BlockedProduct:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    BoostsBuries:
      type: object
      properties:
        numeric:
          type: array
          items:
            $ref: '#/components/schemas/NumericBoostBury'
        alphanumeric:
          type: array
          items:
            $ref: '#/components/schemas/AlphanumericBoostBury'
        product:
          type: array
          items:
            $ref: '#/components/schemas/ProductBoostBury'
      required:
        - numeric
        - alphanumeric
        - product
    BoostsBuriesWithInfo:
      type: object
      properties:
        numeric:
          type: array
          items:
            $ref: '#/components/schemas/NumericBoostBury'
        alphanumeric:
          type: array
          items:
            $ref: '#/components/schemas/AlphanumericBoostBury'
        product:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ProductBoostBury'
              - $ref: '#/components/schemas/Product'
      required:
        - numeric
        - alphanumeric
        - product
    ProductBoostBury:
      type: object
      properties:
        id:
          type: string
        weight:
          type: number
          format: double
      required:
        - id
        - weight
    NumericBoostBury:
      type: object
      properties:
        field:
          type: string
        weight:
          type: number
          format: double
      required:
        - field
        - weight
    AlphanumericBoostBury:
      type: object
      properties:
        fields:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AlphanumericBoostBuryField'
        weight:
          type: number
          format: double
      required:
        - fields
        - weight
    AlphanumericBoostBuryField:
      type: object
      properties:
        field:
          type: string
        values:
          type: array
          items:
            type: string
      required:
        - field
        - values
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status
        - message
    Facets:
      type: object
      properties:
        facets:
          type: array
          items:
            $ref: '#/components/schemas/Facet'
      required:
        - facets
    Facet:
      type: object
      properties:
        id:
          type: string
        order:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/FacetData'
      required:
        - id
        - data
    FacetData:
      type: array
      items:
        $ref: '#/components/schemas/FacetItem'
    FacetItem:
      type: object
      oneOf:
        - $ref: '#/components/schemas/PriceFacetData'
        - $ref: '#/components/schemas/CommonFacetData'
        - $ref: '#/components/schemas/ColourFacetData'
        - $ref: '#/components/schemas/CategoryFacetData'
    Pagination:
      type: object
      properties:
        totalItems:
          type: integer
    Category:
      type: object
      properties:
        identifier:
          type: string
        name:
          type: string
        path:
          type: string
    Categories:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - categories
        - pagination
    AttributesResponse:
      type: object
      properties:
        attributes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AttributeResponseItem'
      required:
        - attributes
    AttributeResponseItem:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AttributeType'
        name:
          type: string
        values:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
            required:
              - value
      required:
        - type
        - name
    AttributeType:
      type: string
      enum: ['alphanumeric', 'numeric']
    CommonFacetData:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          format: int32
        selected:
          type: boolean
        disabled:
          type: boolean
      additionalProperties: false
      required:
        - name
        - count
        - selected
        - disabled
    CategoryFacetData:
      type: object
      properties:
        count:
          type: integer
          format: int32
        cat_id:
          type: string
        selected:
          type: boolean
        name:
          type: string
      required:
        - name
        - cat_id
        - count
        - selected
    ColourFacetData:
      type: object
      properties:
        count:
          type: integer
          format: int32
        name:
          type: string
        colourHexValue:
          type: string
        hexColourType:
          type: boolean
        hasHexCode:
          type: boolean
        disabled:
          type: boolean
        iconValue:
          type: string
        selected:
          type: boolean
      additionalProperties: false
      required:
        - count
        - name
        - colourHexValue
        - hexColourType
        - disabled
        - iconValue
        - selected
        - hasHexCode
    PriceFacetData:
      type: object
      properties:
        minimum:
          type: integer
          format: int32
        maximum:
          type: integer
          format: int32
        selected:
          type: boolean
      required:
        - minimum
        - maximum
        - selected
