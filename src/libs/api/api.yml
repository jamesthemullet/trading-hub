            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '404':
          description: RuleSet was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingReturnedNotFound'
    delete:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API - Ruleset - Category
      summary: Delete Category Rule Set
      description: Deletes a rule set and its merchandising rules.
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to delete
      responses:
        '200':
          description: Rule set was deleted successfully
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
