  /search/beta/merchandising/product:
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Search products for category
      description: >-
        Returns the products for an (optional) category, can be queried by name, product ids or category
        id. Merchandising rules (pin/block/boost) inside the request body will be used to set metadata in the response.
      parameters:
        - in: query
          name: productId
          schema:
            type: array
            items:
              type: string
          required: false
          description: The IDs of products which are to be retrieved. Document IDs of grouped products (where the documentId differs from the productId) are supported
        - in: query
          name: categoryId
          schema:
            type: string
          required: false
          description: The category id to retrieve products for
        - in: query
          name: merchandisingSearchTerm
          schema:
            type: array
            items:
              type: string
          required: false
          description: Filter values based on their relevance to this keyword search term, not supported with categoryId
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: Query to filter result values, currently name/product id are supported
        - in: query
          name: start
          schema:
            type: integer
          required: false
          description: >-
            Display products after this position.
            Required for category, global or text search. Not allowed for specific products.
        - in: query
          name: rows
          schema:
            type: integer
          required: false
          description: >-
            Maximum number of products to be returned.
            Required for category, global or text search. Not allowed for specific products.
        - $ref: '#/components/parameters/catalogueParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchandisingRules'
      responses:
        '200':
          description: A JSON representation of products
          content:
