          name: categoryId
          schema:
            type: string
          description: The category to preview, must be supplied if searchTerm not supplied
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
