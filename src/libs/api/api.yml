      type: string
      enum: ['alphanumeric', 'numeric']
    CountryCode:
      type: string
      enum: ['UK', 'IE', 'UK_IE']
    CommonFacetData:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          format: int32
        selected:
          type: boolean
        disabled:
          type: boolean
      additionalProperties: false
      required:
        - name
        - count
        - selected
        - disabled
    CategoryFacetData:
      type: object
      properties:
        count:
          type: integer
          format: int32
        cat_id:
          type: string
        selected:
          type: boolean
        name:
          type: string
      required:
        - name
        - cat_id
        - count
        - selected
    ColourFacetData:
      type: object
      properties:
        count:
          type: integer
          format: int32
        name:
          type: string
        colourHexValue:
          type: string
        hexColourType:
          type: boolean
        hasHexCode:
          type: boolean
        disabled:
          type: boolean
        iconValue:
          type: string
        selected:
          type: boolean
      additionalProperties: false
      required:
        - count
        - name
        - colourHexValue
        - hexColourType
        - disabled
        - iconValue
        - selected
        - hasHexCode
    PriceFacetData:
      type: object
      properties:
        minimum:
          type: integer
          format: int32
        maximum:
          type: integer
          format: int32
        selected:
          type: boolean
      required:
        - minimum
        - maximum
        - selected
  parameters:
    countryCodeParam:
      name: countryCode
      in: query
      description: Country code to filter by
      required: false
      schema:
        type: string
        enum:
          - UK
          - IE
          - UK_IE
    catalogueParam:
      name: catalogue
      in: query
      description: Catalogue
      required: false
      schema:
        type: string
        enum:
          - MANDSUK
          - MANDSIE
