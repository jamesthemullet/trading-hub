        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
  /search/beta/merchandising/category/ruleset/{ruleSetId}:
