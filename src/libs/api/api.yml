      type: object
      properties:
        facets:
          type: array
          items:
            $ref: '#/components/schemas/Facet'
      required:
        - facets
    Facet:
      type: object
      properties:
        id:
          type: string
        order:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/FacetData'
      required:
        - id
        - data
    FacetData:
      type: array
      items:
        $ref: '#/components/schemas/FacetItem'
    FacetItem:
      type: object
      oneOf:
        - $ref: '#/components/schemas/PriceFacetData'
        - $ref: '#/components/schemas/CommonFacetData'
        - $ref: '#/components/schemas/ColourFacetData'
        - $ref: '#/components/schemas/CategoryFacetData'
    Pagination:
      type: object
      properties:
        totalItems:
          type: integer
    Category:
      type: object
      properties:
        identifier:
          type: string
        name:
          type: string
        path:
          type: string
    Categories:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - categories
        - pagination
    AttributesResponse:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeResponseItem'
      required:
        - attributes
    AttributeResponseItem:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AttributeType'
        name:
          type: string
        values:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
            required:
              - value
      required:
        - type
        - name
