            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API - Ruleset - Category
      summary: Retrieve Category Rule Set
      description: Returns a rule set and its merchandising rules.
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to retrieve
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingReturnedCategoryRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
          content:
            application/json:
