openapi: 3.0.3
info:
  title: Merchandising Hub API
  description: |
    The Merchandising Hub API
  version: 0.0.1
servers:
  - url: 'https://api.tradinghub.azurewebsites.com/v1'
    description: Main (production) server
  - url: 'https://api.dev.tradinghub.azurewebsites.com/v1'
    description: Main (dev) server
  - url: 'http://localhost:4000/v1'
    description: Local dev server
paths:
  /search/beta/merchandising/category:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Get categories available for merchandising
      description: >-
        Returns the categories available for merchandising, can be queried by
        name or category id
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
        - $ref: '#/components/parameters/catalogueParam'
      responses:
        '200':
          description: A JSON representation of available categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingCategories'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
  /search/beta/merchandising/attributes:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Get merchandising attributes
      description: Returns the merchandising attributes
      parameters:
        - in: query
          name: searchTerm
          schema:
            type: array
            items:
              type: string
          required: false
          description: Filter values based on their relevance to this keyword search term
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: Query to filter alphanumeric result values, not supported for numeric attributeType
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/MerchandisingAttributeType'
          required: false
          description: The type of attributes to retrieve
        - in: query
          name: categoryId
          schema:
            type: string
          description: The category to retrieve attributes for
        - $ref: '#/components/parameters/catalogueParam'
      responses:
        '200':
          description: A JSON representation of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingAttributesResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
  /search/beta/merchandising/category/ruleset:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API - Ruleset - Category
      summary: Retrieve the Category Rule Sets
      description: >-
        Returns all category rule sets ordered by the most recently changed. Can be queried by
        name, category id or most recent editor.  Searches are case-insensitve and partial matches are sufficient.
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: either category name, category id or most recent editor (or any partial match)
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
        - $ref: '#/components/parameters/countryCodeParam'
        - $ref: '#/components/parameters/havingRulesParam'
      responses:
        '200':
          description: A JSON array with representations of rule sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingReturnedCategoryRuleSets'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingErrorResponse'
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API - Ruleset - Category
      summary: Create a Category Rule Set
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchandisingCategoryRuleSet'
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingReturnedCategoryRuleSet'
        '500':
