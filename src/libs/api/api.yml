openapi: 3.0.3
info:
  title: Trading Hub API
  description: |
    The Trading Hub API
  version: 0.0.1
servers:
  - url: 'http://api.tradinghub.azurewebsites.com/v1'
    description: Main (production) server
  - url: 'http://api.dev.tradinghub.azurewebsites.com/v1'
    description: Main (dev) server
  - url: 'http://localhost:4000/v1'
    description: Local dev server
paths:
  /merchandising/category/:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Get categories available for merchandising
      description: >-
        Returns the categories available for merchandising, can be queried by
        name or category id
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: A JSON representation of available categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges

  /merchandising/facet/{facetId}/attributeValues:
    $ref: '#/paths/~1search~1beta~1merchandising~1facet~1{facetId}~1attributeValues'
  /search/beta/merchandising/facet/{facetId}/attributeValues:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Facet values response
      description: Returns the available attributes for a specific facet
      parameters:
        - in: path
          name: facetId
          schema:
            type: string
          required: true
          description: The facet to retrieve the attributes for
        - in: query
          name: ruleSetId
          schema:
            type: string
          required: false
          description: view the facets in the context of this rule set
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: Search for a value
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display attribute values after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
          description: Number of attribute values to return
      responses:
        '200':
          description: A JSON representation of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeValuesResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  /merchandising/category/{categoryId}/attributes:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Category Attributes Response
      description: Returns the available attributes for category or all attributes if category not provided.
      parameters:
        - in: path
          name: categoryId
          schema:
            type: string
          required: true
          description: The category to retrieve the attributes for
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/AttributeType'
          required: false
          description: The number type of attributes to retrieve
      responses:
        '200':
          description: A JSON representation of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributesResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  /search/beta/merchandising/attributes:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: All available attributes
      description: Returns the available attributes
      responses:
        '200':
          description: A JSON representation of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributesResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  '/merchandising/category/{categoryId}/preview':
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      deprecated: true
      summary: Preview Search Response
      description: Returns a search response with specified rules applied.
      parameters:
        - in: path
          name: categoryId
          schema:
            type: string
          required: true
          description: The category to preview
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
          description: The number of products to display
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchandisingRules'
      responses:
        '200':
          description: A JSON representation of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPreviewResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  '/search/beta/merchandising/category/{categoryId}/preview':
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Preview Search Response
      description: Returns a search response with specified rules applied.
      parameters:
        - in: path
          name: categoryId
          schema:
            type: string
          required: true
          description: The category to preview
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
          description: The number of products to display
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSet'
      responses:
        '200':
          description: A JSON representation of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPreviewResponseBeta'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges

  /search/beta/merchandising/category/ruleset/:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Retrieve the Category Rule Sets
      description: >-
        All rule sets ordered by most recently changed, can be queried by
        name, category id or most recent editor
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: either category name, category id or most recent editor
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: A JSON array with representations of rule sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRuleSets'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Create a Category Rule Set
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRuleSet'
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedCategoryRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  /merchandising/ruleset/:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Retrieve the Rule Sets
      deprecated: true
      description: >-
        All rule sets ordered by most recently changed, can be queried by
        name, category id or most recent editor
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: either name, category id or most recent editor
        - in: query
          name: queryType
          schema:
            type: string
            enum:
              - category_id
              - category_name
              - user_name
          required: false
          description: type of query, only used if query specified. default is category_id
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: A JSON array with representations of rule sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRuleSets'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Create Rule Set
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSet'
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  /merchandising/ruleset/{ruleSetId}:
    put:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Update Rule Set
      deprecated: true
      description: Persists merchandising rules and takes effect for customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSet'
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to update
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Retrieve Rule Set
      deprecated: true
      description: Returns a rule set and its merchandising rules.
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to retrieve
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '404':
          description: RuleSet was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedRuleSetNotFound'
        '403':
          description: Insufficient privileges
    delete:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Delete Rule Set
      deprecated: true
      description: Deletes a rule set and its merchandising rules.
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to delete
      responses:
        '200':
          description: Rule set was deleted successfully
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  /search/beta/merchandising/category/ruleset/{ruleSetId}:
    put:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Update Category Rule Set
      description: Persists merchandising rules and takes effect for customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRuleSet'
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to update
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedCategoryRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Retrieve Category Rule Set
      description: Returns a rule set and its merchandising rules.
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to retrieve
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedCategoryRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
        '404':
          description: RuleSet was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedRuleSetNotFound'
    delete:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Delete Category Rule Set
      description: Deletes a rule set and its merchandising rules.
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to delete
      responses:
        '200':
          description: Rule set was deleted successfully
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  /search/beta/merchandising/global/ruleset/:
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Retrieve the global Rule Sets
      description: >-
        All rule sets ordered by most recently changed, can be queried by recent editor
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: search by most recent editor
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display Rule Sets after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: A JSON array with representations of rule sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalRuleSets'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Create a Global Rule Set
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSet'
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedGlobalRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  /search/beta/merchandising/global/ruleset/{ruleSetId}:
    put:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Update Global Rule Set
      description: Persists merchandising rules and takes effect for customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSet'
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to update
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedGlobalRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Retrieve Global Rule Set
      description: Returns a rule set and its merchandising rules.
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to retrieve
      responses:
        '200':
          description: A JSON representation of merchandising rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedGlobalRuleSet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
        '404':
          description: RuleSet was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedRuleSetNotFound'
    delete:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Delete Global Rule Set
      description: Deletes a rule set and its merchandising rules.
      parameters:
        - in: path
          name: ruleSetId
          schema:
            type: string
          required: true
          description: The Rule Set to delete
      responses:
        '200':
          description: Rule set was deleted successfully
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  /merchandising/product:
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Search products for category
      description: >-
        Returns the products for a category, can be queried by name/product id or category
        id and merchandising rules (pin/block/boost) inside request body will be used to set metadata in the response
      parameters:
        - in: query
          name: categoryIds
          schema:
            type: array
            items:
              type: string
          required: true
          description: The category ids to retrieve products for
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: Search term, currently name/product id are supported
        - in: query
          name: start
          schema:
            type: integer
          required: true
          description: Display products after this position
        - in: query
          name: rows
          schema:
            type: integer
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchandisingRules'
      responses:
        '200':
          description: A JSON representation of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  '/merchandising/facet':
    $ref: '#/paths/~1search~1beta~1merchandising~1facet'
  '/search/beta/merchandising/facet':
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Get all Global facets
      description: >-
        Returns the Global facets, if a rulesSetId is passed includes config data related to that Rule Set, 
        such as if it is included or not. 

        The included facets are returned first, then everything is ordered alphabetically by "indexPropertyName"
      parameters:
        - in: query
          name: ruleSetId
          schema:
            type: array
            items:
              type: string
          required: false
          description: When provided will only return facets relevant to the queries related to this Rule Set, as well as configuration related to the provided Rule Set, such as if the facet is included or not
      responses:
        '200':
          description: A JSON representation of the facet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacetsList'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
    post:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Create a Facet at the global level

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacetConfig'
      responses:
        '200':
          description: A JSON representation of the facet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedGlobalFacet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
  '/merchandising/facet/{facetId}':
    $ref: '#/paths/~1search~1beta~1merchandising~1facet~1{facetId}'
  '/search/beta/merchandising/facet/{facetId}':
    get:
      security:
        - bearerAuth: []
      tags:
        - Search Merchandising API
      summary: Get Global facet config
      parameters:
        - in: path
          name: facetId
          schema:
            type: string
          required: true
          description: The facet to retrieve
      responses:
        '200':
          description: A JSON representation of the facet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedFacet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Search Merchandising API
      summary: Update a Facet at the global level
      parameters:
        - in: path
          name: facetId
          schema:
            type: string
          required: true
          description: The facet to update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacetConfig'
      responses:
        '200':
          description: A JSON representation of the facet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedFacet'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized e.g. no bearer token specified
        '403':
          description: Insufficient privileges
    delete:
      tags:
        - Search Merchandising API
      summary: Delete a facet at the global level
      parameters:
        - in: path
          name: facetId
          schema:
            type: string
          required: true
          description: The facet to update
      responses:
        '200':
          description: The resource was successfully deleted
        '500':
