name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3.5.3

      - name: Get versions from package.json
        id: get-versions-from-package-json
        shell: bash
        run: |
          set -x
          NODE_VERSION=$(jq -r '.engines.node' < package.json)
          PNPM_VERSION=$(jq -r '.engines.pnpm' < package.json)
          echo "node-version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pnpm-version=${PNPM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        shell: bash
        run: |
          set -x
          npm install pnpm@"${{ steps.get-versions-from-package-json.outputs.pnpm-version }}" -g
          echo "pnpm version: $(pnpm --version)"

      - uses: actions/setup-node@v4.0.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "10"
        with:
          node-version: ${{ steps.get-versions-from-package-json.outputs.node-version }}
          cache: pnpm

      - name: pnpm install and build
        run: |
          pnpm install
          pnpm run build

      - name: Zip all files for upload between jobs
        # IMPORTANT: .next is a hidden folder and will NOT be included in the zip unless we specify it
        run: |
          cd .next/standalone
          zip next.zip ./* .next -qr

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v3.1.2
        with:
          name: node-app
          path: .next/standalone/next.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3.0.2
        with:
          name: node-app

      #TODO: deploy to Azure Web App

      - name: Delete zip file
        run: rm next.zip
