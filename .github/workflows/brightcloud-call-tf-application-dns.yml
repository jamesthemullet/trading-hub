name: bc-tf-app-dns
on:
  pull_request:
    paths:
      - '.github/workflows/brightcloud-call-tf-application-dns.yml'
      - 'ci/infra/terraform/vars/common.tfvars'
      - 'ci/infra/terraform/vars/production/layer-0-application-dns.tfvars'
      - 'ci/infra/terraform/vars/non-production/layer-0-application-dns.tfvars'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/brightcloud-call-tf-application-dns.yml'
      - 'ci/infra/terraform/vars/common.tfvars'
      - 'ci/infra/terraform/vars/production/layer-0-application-dns.tfvars'
      - 'ci/infra/terraform/vars/non-production/layer-0-application-dns.tfvars'
# 2
jobs:
  check-vars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check composite parameter for the reusable pipeline
        id: check-composite-vars
        uses: DigitalInnovation/brightcloud/.github/actions/check-layer-runtime-type@v1.6.6
    outputs:
      oidc: ${{ steps.check-composite-vars.outputs.oidc}}

  call-tf-plan-dns-app:
    needs:
      - check-vars
    if: ${{ needs.check-vars.outputs.oidc != 'true' }}
    uses: DigitalInnovation/brightcloud/.github/workflows/tf-application-dns.yml@v1.6.6
    with:
      TRIGGER_EVENT: ${{ github.event_name }}
    secrets:
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SP_PASSWORD: ${{ secrets.SP_PASSWORD }}
      SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
      BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}

  call-tf-plan-dns-app-oidc:
    needs:
      - check-vars
    if: ${{ needs.check-vars.outputs.oidc == 'true' }}
    uses: DigitalInnovation/brightcloud/.github/workflows/tf-application-dns-oidc.yml@v1.6.6
    with:
      TRIGGER_EVENT: ${{ github.event_name }}
    secrets:
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
      BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
