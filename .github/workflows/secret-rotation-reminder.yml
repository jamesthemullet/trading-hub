name: Secret rotation reminder

on:
  schedule:
    - cron: '0 9 20 2,5,8,11 *' # 9am UTC on 20th of Aug, Nov, Feb, May — ~10 days before 90-day expiry
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    name: Open secret rotation reminder issue
    runs-on: ubuntu-latest
    steps:
      - name: Create reminder issue
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🔑 PROD smoke-test yaccount password expires soon" \
            --label "automation" \
            --body "$(cat <<'EOF'
          The PROD_TEST_USER_PASSWORD secret expires every 90 days.

          Follow the [secret rotation guide](docs/secret-rotation.md#prod-smoke-test-yaccount-password-reset) to renew it.

          1. Request a password reset via [Access Management](https://mnscorp-rod-myit.onbmc.com/dwp/app/#/itemprofile/404)
          2. Update `PROD_TEST_USER_PASSWORD` in repo Settings → Secrets → Actions
          3. Trigger the [production smoke workflow](.github/workflows/smoke-tests-prod.yml) to validate
          EOF
            )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
