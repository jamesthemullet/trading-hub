name: Accessibility Audit

on:
  schedule:
    # Runs on the first and third Monday of each month at 09:00 UTC (~bi-weekly)
    - cron: '0 9 1-7,15-21 * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  trigger-audit:
    name: Create accessibility audit issue for Copilot
    runs-on: ubuntu-latest
    steps:
      - name: Create issue assigned to Copilot
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `a11y audit: ${today}`,
              body: `## Scheduled accessibility audit\n\nPlease run the \`accessibility\` skill to audit Trading Hub for WCAG 2.1 AA violations and raise PRs for any findings.\n\nSee \`.github/skills/accessibility/SKILL.md\` for full instructions.`,
              labels: ['accessibility'],
              assignees: ['copilot']
            });
