# Writes the web app secrets into the dev Key Vault so App Service can resolve
# them through Key Vault references instead of plain app settings (PSP-6240).
# Dev only for now: prod will be added once this has been proven on dev.
#
# The vault is private (public network access disabled) and uses access
# policies, so this runs on the BrightCloud runner that has a private endpoint
# into the vault, as the deploy service principal. The service principal grants
# itself temporary secret write access and removes it again at the end.
#
# Values come from KV_SEED_* secrets on the Nonprod environment. They must not
# start with "_" (the webapp-stack workflow copies "_"-prefixed secrets into app
# settings). Delete them once the run has succeeded.
name: kv-seed-secrets

on:
  workflow_dispatch:
    inputs:
      azure_ad_client_secret_expires:
        description: End date of the Entra client secret in UTC, e.g. 2027-04-30T00:00:00Z or 2027-04-30. Required when KV_SEED_AZURE_AD_CLIENT_SECRET is set.
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  seed:
    name: Write secrets to dev Key Vault
    # Stops a stale or unreviewed branch copy being run by accident. This is not
    # a security boundary: a dispatch runs the dispatched ref's copy of this file.
    if: github.ref == 'refs/heads/main'
    # The label GIT_ACTIONS_RUNNER_LABEL holds on the Nonprod environment
    # (runs-on cannot read environment variables). This runner has a private
    # endpoint into the vault, which the first step checks.
    runs-on: trading-hub-nprod-runner
    environment: Nonprod
    timeout-minutes: 10
    permissions:
      id-token: write # required for Azure OIDC login
    env:
      SEED_ENVIRONMENT: Nonprod
      SUBSCRIPTION_NAME: MandS - V2 - Non Production - Customer & Loyalty - tradehub
      KEY_VAULT: tradevz2bvlzr43hm1xbk95
      KEY_VAULT_RESOURCE_GROUP: dev-trading-hub-v1-eun-layer2-rg
      ACCESS_POLICY_API_VERSION: '2025-05-01'

    steps:
      - name: Check inputs and private access to the vault
        id: preflight
        env:
          AZURE_AD_CLIENT_SECRET: ${{ secrets.KV_SEED_AZURE_AD_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.KV_SEED_NEXTAUTH_SECRET }}
          MERCHANDISING_API_APIGEE_KEY: ${{ secrets.KV_SEED_MERCHANDISING_API_APIGEE_KEY }}
          EXPIRES_INPUT: ${{ inputs.azure_ad_client_secret_expires }}
        run: |
          if [ -z "${AZURE_AD_CLIENT_SECRET}${NEXTAUTH_SECRET}${MERCHANDISING_API_APIGEE_KEY}" ]; then
            echo "::error::No KV_SEED_* value is visible. Create KV_SEED_AZURE_AD_CLIENT_SECRET, KV_SEED_NEXTAUTH_SECRET and/or KV_SEED_MERCHANDISING_API_APIGEE_KEY as secrets (not variables) on the ${SEED_ENVIRONMENT} environment."
            exit 1
          fi

          expires=""
          if [ -n "${EXPIRES_INPUT}" ]; then
            # The formats az --expires accepts.
            expires_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}(T([01][0-9]|2[0-3])(:[0-5][0-9](:[0-5][0-9])?)?Z)?$'
            if [[ ! "${EXPIRES_INPUT}" =~ ${expires_pattern} ]]; then
              echo "::error::azure_ad_client_secret_expires must be a UTC date like 2027-04-30T00:00:00Z or 2027-04-30"
              exit 1
            fi
            # Expand to YYYY-MM-DDTHH:MM:SSZ, then check it is a real instant
            # (date normalises 2027-02-30 to March, which the round trip catches)
            # and that it is still in the future.
            expires="${EXPIRES_INPUT%Z}"
            case "${#expires}" in
              10) expires="${expires}T00:00:00Z" ;;
              13) expires="${expires}:00:00Z" ;;
              16) expires="${expires}:00Z" ;;
              *) expires="${expires}Z" ;;
            esac
            if ! expires_epoch=$(date -u -d "${expires}" +%s 2> /dev/null) ||
              [ "$(date -u -d "@${expires_epoch}" +%Y-%m-%dT%H:%M:%SZ)" != "${expires}" ]; then
              echo "::error::azure_ad_client_secret_expires is not a valid date: ${EXPIRES_INPUT}"
              exit 1
            fi
            if [ "${expires_epoch}" -le "$(date -u +%s)" ]; then
              echo "::error::azure_ad_client_secret_expires is not in the future: ${expires}"
              exit 1
            fi
          fi
          if [ -n "${AZURE_AD_CLIENT_SECRET}" ] && [ -z "${expires}" ]; then
            echo "::error::Set azure_ad_client_secret_expires to the Entra client secret's end date"
            exit 1
          fi
          {
            echo "azure_ad_client_secret_expires=${expires}"
            # The other secrets have no fixed end date. An expiry keeps them
            # compliant with the "secrets should have an expiration date" policy
            # and is informational only: App Service can still read them after it.
            echo "default_expires=$(date -u -d '+365 days' +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

          vault_ip=$(getent hosts "${KEY_VAULT}.vault.azure.net" | awk '{ print $1; exit }') || true
          echo "${KEY_VAULT}.vault.azure.net resolves to ${vault_ip:-nothing}"
          case "${vault_ip}" in
            10.* | 172.1[6-9].* | 172.2[0-9].* | 172.3[01].* | 192.168.*) ;;
            *)
              echo "::error::${KEY_VAULT} does not resolve to a private endpoint from this runner"
              exit 1
              ;;
          esac

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.SP_CLIENT_ID }}
          # Same literal as the BrightCloud workflows. _AZURE_AD_TENANT_ID is not
          # on the Nonprod environment.
          tenant-id: bd5c6713-7399-4b31-be79-78f2d078e543
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Grant temporary secret write access
        id: grant
        run: |
          # Read the service principal's object ID from its own access token, so
          # no Microsoft Graph permission is needed.
          token=$(az account get-access-token --query accessToken -o tsv)
          payload=$(printf '%s' "${token}" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          sp_object_id=$(printf '%s' "${payload}" | base64 -d | jq -r '.oid')
          tenant_id=$(az account show --query tenantId -o tsv)
          vault_id=$(az keyvault show --name "${KEY_VAULT}" --resource-group "${KEY_VAULT_RESOURCE_GROUP}" --query id -o tsv)

          # Only run when the service principal has no access policy on the vault,
          # so the clean-up can only ever remove access this run created.
          existing=$(az keyvault show --name "${KEY_VAULT}" --resource-group "${KEY_VAULT_RESOURCE_GROUP}" \
            --query "properties.accessPolicies[?objectId=='${sp_object_id}'].permissions" -o json)
          if [ "$(jq '[.[] | (.keys // []) + (.secrets // []) + (.certificates // []) + (.storage // [])] | add // [] | length' <<< "${existing}")" -ne 0 ]; then
            echo "::error::The service principal ${sp_object_id} already has an access policy on ${KEY_VAULT}: ${existing}. A previous run's clean-up may have failed. Remove it by hand before running again."
            exit 1
          fi

          # Written before the grant, so the clean-up step also runs if the grant
          # call fails after Azure has applied it.
          {
            echo "sp_object_id=${sp_object_id}"
            echo "tenant_id=${tenant_id}"
            echo "vault_id=${vault_id}"
            echo "granted=true"
          } >> "${GITHUB_OUTPUT}"

          # accessPolicies/add changes only this principal's entry, unlike
          # `az keyvault set-policy`, which rewrites the whole vault.
          body=$(jq -cn --arg tenant "${tenant_id}" --arg object "${sp_object_id}" \
            '{properties: {accessPolicies: [{tenantId: $tenant, objectId: $object, permissions: {secrets: ["list", "set"]}}]}}')
          az rest --method put \
            --url "https://management.azure.com${vault_id}/accessPolicies/add?api-version=${ACCESS_POLICY_API_VERSION}" \
            --body "${body}" -o none
          echo "Granted secret permissions: list set"

      - name: Write secrets
        env:
          AZURE_AD_CLIENT_SECRET: ${{ secrets.KV_SEED_AZURE_AD_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.KV_SEED_NEXTAUTH_SECRET }}
          MERCHANDISING_API_APIGEE_KEY: ${{ secrets.KV_SEED_MERCHANDISING_API_APIGEE_KEY }}
          AZURE_AD_CLIENT_SECRET_EXPIRES: ${{ steps.preflight.outputs.azure_ad_client_secret_expires }}
          DEFAULT_EXPIRES: ${{ steps.preflight.outputs.default_expires }}
        run: |
          written=()

          # The value is passed through process substitution, so it is never on a
          # command line or written to disk.
          write_secret() {
            local setting=$1 name=$2 value=$3 expires=$4
            if [ -z "${value}" ]; then
              echo "::notice::Skipped ${name}: KV_SEED_${setting} is not set"
              return 0
            fi
            local attempt rc
            for attempt in 1 2 3 4 5 6; do
              rc=0
              az keyvault secret set --vault-name "${KEY_VAULT}" --name "${name}" \
                --file <(printf '%s' "${value}") --encoding utf-8 \
                --content-type text/plain --tags owner=search-squad source=PSP-6240 \
                --expires "${expires}" -o none || rc=$?
              if [ "${rc}" -eq 0 ]; then
                echo "Wrote ${name} (expires ${expires})"
                written+=("${setting}=${name}")
                return 0
              fi
              # Exit code 2 is an argument error, which a retry will not fix.
              if [ "${rc}" -eq 2 ]; then
                break
              fi
              # Otherwise retry while the new access policy propagates.
              echo "Writing ${name} failed (attempt ${attempt}), retrying"
              sleep 10
            done
            echo "::error::Could not write ${name}"
            return 1
          }

          write_secret AZURE_AD_CLIENT_SECRET azure-ad-client-secret "${AZURE_AD_CLIENT_SECRET}" "${AZURE_AD_CLIENT_SECRET_EXPIRES}"
          write_secret NEXTAUTH_SECRET nextauth-secret "${NEXTAUTH_SECRET}" "${DEFAULT_EXPIRES}"
          write_secret MERCHANDISING_API_APIGEE_KEY merchandising-api-apigee-key "${MERCHANDISING_API_APIGEE_KEY}" "${DEFAULT_EXPIRES}"

          {
            echo "### Key Vault references for ${KEY_VAULT}"
            echo
            echo '```'
            for entry in "${written[@]}"; do
              echo "${entry%%=*} = @Microsoft.KeyVault(VaultName=${KEY_VAULT};SecretName=${entry#*=})"
            done
            echo '```'
            echo
            echo "- Delete the KV_SEED_* secrets from the ${SEED_ENVIRONMENT} environment now."
            echo "- Before switching app settings to these references, the app needs VNet route-all (vnetRouteAllEnabled), which is currently off. Without it, Linux apps cannot resolve references to this private vault."
            echo "- release.yml, hotfix.yml and the webapp-stack Terraform still set these app settings to plain values. Change them too, or the next deploy reverts the references."
            echo "- After a rotation, apps keep the cached value for up to 24 hours. Restart them or refresh their Key Vault references before revoking the old credential."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: List secrets in the vault
        run: |
          az keyvault secret list --vault-name "${KEY_VAULT}" \
            --query "[].{name: name, enabled: attributes.enabled, updated: attributes.updated, expires: attributes.expires}" -o table

      - name: Remove temporary secret write access
        if: always() && steps.grant.outputs.granted == 'true'
        env:
          SP_OBJECT_ID: ${{ steps.grant.outputs.sp_object_id }}
          TENANT_ID: ${{ steps.grant.outputs.tenant_id }}
          VAULT_ID: ${{ steps.grant.outputs.vault_id }}
        run: |
          body=$(jq -cn --arg tenant "${TENANT_ID}" --arg object "${SP_OBJECT_ID}" \
            '{properties: {accessPolicies: [{tenantId: $tenant, objectId: $object, permissions: {secrets: ["list", "set"]}}]}}')
          url="https://management.azure.com${VAULT_ID}/accessPolicies/remove?api-version=${ACCESS_POLICY_API_VERSION}"

          # The service principal had no access policy before this run, so check
          # that none is left afterwards.
          remaining_permissions() {
            az keyvault show --name "${KEY_VAULT}" --resource-group "${KEY_VAULT_RESOURCE_GROUP}" \
              --query "properties.accessPolicies[?objectId=='${SP_OBJECT_ID}'].permissions" -o json |
              jq '[.[] | (.keys // []) + (.secrets // []) + (.certificates // []) + (.storage // [])] | add // [] | length'
          }

          for attempt in 1 2 3 4 5; do
            if az rest --method put --url "${url}" --body "${body}" -o none &&
              [ "$(remaining_permissions)" -eq 0 ]; then
              echo "Removed the temporary access policy"
              exit 0
            fi
            echo "Removing the temporary access policy failed (attempt ${attempt}), retrying"
            sleep 15
          done

          echo "::error::Could not remove the service principal's access policy from ${KEY_VAULT}. The next run will refuse to start until it is removed. Remove it by hand (see the job summary)."
          # GitHub masks the subscription ID in the summary, so the command looks
          # the vault ID up itself instead of embedding it.
          {
            echo "### Temporary access was NOT removed"
            echo
            echo '```'
            echo "az account set --subscription '${SUBSCRIPTION_NAME}'"
            echo "az rest --method put --url \"https://management.azure.com\$(az keyvault show --name ${KEY_VAULT} --resource-group ${KEY_VAULT_RESOURCE_GROUP} --query id -o tsv)/accessPolicies/remove?api-version=${ACCESS_POLICY_API_VERSION}\" --body '${body}'"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
