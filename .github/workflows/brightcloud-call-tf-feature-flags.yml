name: bc-tf-feature-flags
on:
  pull_request:
    paths:
      - ".github/workflows/brightcloud-call-tf-feature-flags.yml"
      - "ci/infra/terraform/vars/common.tfvars"
      - "ci/infra/terraform/vars/production/*"
      - "ci/infra/terraform/vars/non-production/*"
      - "ci/infra/terraform/vars/feature-flags.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/brightcloud-call-tf-feature-flags.yml"
      - "ci/infra/terraform/vars/common.tfvars"
      - "ci/infra/terraform/vars/production/*"
      - "ci/infra/terraform/vars/non-production/*"
      - "ci/infra/terraform/vars/feature-flags.json"
jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: check for secrets needed for layer 2 feature flags
        id: check-secrets
        run: |
          LAUNCHDARKLY_ACCESS_TOKEN=${{ secrets.LAUNCHDARKLY_ACCESS_TOKEN }}
          if [ -z $LAUNCHDARKLY_ACCESS_TOKEN ]; then
            echo "has_required_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_required_secrets=true" >> "$GITHUB_OUTPUT" 
          fi
    outputs:
      has_required_secrets: ${{ steps.check-secrets.outputs.has_required_secrets }}
  call-tf-feature-flags-env:
    needs:
      - check-secrets
    if: ${{ needs.check-secrets.outputs.has_required_secrets == 'true' }} # pragma: allowlist secret
    uses: DigitalInnovation/brightcloud/.github/workflows/tf-feature-flags-env.yml@feat/oidcn
    with:
      TRIGGER_EVENT: ${{ github.event_name }}
      BRIGHTCLOUD_REF: feat/oidcn
    secrets:
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SP_PASSWORD: ${{ secrets.SP_PASSWORD }}
      SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
      BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
      LAUNCHDARKLY_ACCESS_TOKEN: ${{ secrets.LAUNCHDARKLY_ACCESS_TOKEN }}

  call-tf-feature-flags:
    needs: [check-secrets, call-tf-feature-flags-env]
    if: ${{ needs.check-secrets.outputs.has_required_secrets == 'true' }} # pragma: allowlist secret
    uses: DigitalInnovation/brightcloud/.github/workflows/tf-feature-flags.yml@feat/oidcn
    with:
      TRIGGER_EVENT: ${{ github.event_name }}
      BRIGHTCLOUD_REF: feat/oidcn
    secrets:
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SP_PASSWORD: ${{ secrets.SP_PASSWORD }}
      SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
      BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
      LAUNCHDARKLY_ACCESS_TOKEN: ${{ secrets.LAUNCHDARKLY_ACCESS_TOKEN }}
