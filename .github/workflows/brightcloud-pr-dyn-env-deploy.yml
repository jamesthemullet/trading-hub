name: pr-dyn-env-deploy

env:
  GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
  BRIGHTCLOUD_REF: feat/oidcn

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

on:
  pull_request:
    types: [labeled, unlabeled]
    branches:
      - main

jobs:
  check-vars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check composite parameter for the reusable pipeline
        id : check-composite-vars
        uses: DigitalInnovation/brightcloud/.github/actions/check-layer-runtime-type@feat/oidcn
    outputs:
      linux-fx-version: ${{ steps.check-composite-vars.outputs.linux-fx-version }}
      oidc: ${{ steps.check-composite-vars.outputs.oidc}}


  deploy-dynamic-pr-env:
    if: ${{ github.event.label.name != 'dont-bother-ci' }}
    runs-on: ubuntu-latest
    needs:
      - check-vars
    environment:
      name: deveun
    name: deploy-dynamic-pr-env
    steps:
      - name: Checkout-local-repo
        uses: actions/checkout@v4
      - id: dynamic-env-name
        uses: DigitalInnovation/brightcloud/.github/actions/get-app-name@feat/oidcn
      - name: Get changed files
        id: changed-ci
        uses: tj-actions/changed-files@v45
        with:
          files: |
            ci/**
      - id: deployment-exists
        run: |
          set +e
          echo "should_build_env=false" >> "$GITHUB_OUTPUT"
          curl -I https://${{ steps.dynamic-env-name.outputs.dynamic-env-name }}.azurewebsites.net
          EXITCODE=$?
          if [ "$EXITCODE" -eq "6" ]; then
            echo "should_build_env=true" >> "$GITHUB_OUTPUT"
          fi
          set -e
          exit 0
      - id: dynamic-env-deploy-oidc
        if: ${{ needs.check-vars.outputs.oidc == 'true' && (steps.changed-ci.outputs.any_changed == 'true' || steps.deployment-exists.outputs.should_build_env == 'true') }}
        uses: DigitalInnovation/brightcloud/.github/actions/webapp-dynamic-env-oidc@feat/oidcn
        with:
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
          BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
          ALL_SECRETS: ('${{ toJSON(secrets) }}')
          DYNAMIC_ENV_APP_NAME: ${{ steps.dynamic-env-name.outputs.dynamic-env-name }}
          APP_NAME: ${{ steps.dynamic-env-name.outputs.app-name }}
          TTL: 1h
          MAX_APPS_IN_ASP: 25
          BRIGHTCLOUD_REF: feat/oidcn
          APP_STACK: ${{ needs.check-vars.outputs.linux-fx-version }}
      - id: dynamic-env-deploy
        if: ${{ needs.check-vars.outputs.oidc != 'true' && (steps.changed-ci.outputs.any_changed == 'true' || steps.deployment-exists.outputs.should_build_env == 'true') }}
        uses: DigitalInnovation/brightcloud/.github/actions/webapp-dynamic-env@feat/oidcn
        with:
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_PASSWORD: ${{ secrets.SP_PASSWORD }}
          SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
          BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
          ALL_SECRETS: ('${{ toJSON(secrets) }}')
          DYNAMIC_ENV_APP_NAME: ${{ steps.dynamic-env-name.outputs.dynamic-env-name }}
          APP_NAME: ${{ steps.dynamic-env-name.outputs.app-name }}
          TTL: 1h
          MAX_APPS_IN_ASP: 25
          BRIGHTCLOUD_REF: feat/oidcn
      - name: print outputs
        run: |
          echo ${{ steps.dynamic-env-deploy.outputs.env-url }}
          echo ${{ steps.dynamic-env-deploy.outputs.app-resource-group }}
