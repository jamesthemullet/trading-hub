name: Release

on:
  repository_dispatch:
    types: [production-release]

  workflow_dispatch:
    inputs:
      app-name:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}

permissions:
  actions: read
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  onyx:
    uses: DigitalInnovation/onyx/.github/workflows/release-to-dynamic-webapp.yml@feat/remote-release-repo-pr-env
    with:
      app-name: ${{ github.event.inputs.app-name }}
    secrets:
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SP_PASSWORD: ${{ secrets.SP_PASSWORD }}
      SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
      BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
      APP_SECRETS: '{}'
