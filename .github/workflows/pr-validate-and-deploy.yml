name: PR validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - hotfix
  merge_group:
    types: [checks_requested]
permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  DYNATRACE_URL: ${{ secrets.DYNATRACE_URL }}
  DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
  NEXT_PUBLIC_AUTO_LOGIN: false

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    outputs:
      workflow-start-time: ${{ steps.workflow-start.outputs.start_time }}
    steps:
      - name: Record workflow start time
        id: workflow-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Rebuild SWC bindings
        run: pnpm rebuild @swc/core

      - name: Check formatting
        run: pnpm run format:check

      - name: Codegen
        run: pnpm run codegen

      - name: Check typescript
        run: pnpm run ts-check

      - name: Lint
        run: pnpm run lint

      - name: Track job timing
        if: success()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.job-start.outputs.start_time }}))
          echo "Code quality job duration: ${duration} seconds"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: code-quality",
              "description": "Code quality checks completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: ${{ job.status }}",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "code-quality",
                "duration": '"$duration"',
                "status": "${{ job.status }}",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send code-quality timing event to Dynatrace"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --ignore-unfixable

  istanbul-ignore-check:
    name: Istanbul Ignore Reasons
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Check new istanbul ignores have a reason
        run: node scripts/check-new-istanbul-ignores.mjs "${{ github.event.pull_request.base.sha }}"

  knip:
    name: Knip
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Codegen
        run: pnpm run codegen

      - name: Run Knip
        run: pnpm knip

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Test
        run: pnpm run codegen && pnpm test --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0

      - name: Track unit-tests timing
        if: success()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.job-start.outputs.start_time }}))
          echo "Unit tests duration: ${duration} seconds"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: unit-tests",
              "description": "Unit tests and SonarCloud scan completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: ${{ job.status }}",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "unit-tests",
                "duration": '"$duration"',
                "status": "${{ job.status }}",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send unit-tests timing event to Dynatrace"

  build:
    name: Build and upload the app
    runs-on: ubuntu-latest
    needs: dependency-audit
    steps:
      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Build
        run: pnpm run build

      - name: Validate standalone output
        run: |
          set -euxo pipefail
          ls -la .next/standalone
          test -f .next/standalone/server.js

      - name: Track bundle sizes
        if: success()
        run: |
          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          client_js_kb=$(du -sk .next/static/chunks 2>/dev/null | awk 'NR == 1 { print $1 }' || true)
          static_kb=$(du -sk .next/static 2>/dev/null | awk 'NR == 1 { print $1 }' || true)
          artifact_path=".next/standalone/next.zip"

          if [ ! -e "$artifact_path" ]; then
            artifact_path=".next/standalone"
          fi

          artifact_kb=$(du -sk "$artifact_path" 2>/dev/null | awk 'NR == 1 { print $1 }' || true)

          client_js_kb=${client_js_kb:-0}
          static_kb=${static_kb:-0}
          artifact_kb=${artifact_kb:-0}

          echo "Client JS chunks: ${client_js_kb} KB"
          echo "Static assets:    ${static_kb} KB"
          echo "Artifact:         ${artifact_kb} KB"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "Bundle Sizes: ${{ github.ref_name }}",
              "description": "Bundle sizes after build — client JS: '"${client_js_kb}"' KB, static: '"${static_kb}"' KB, artifact: '"${artifact_kb}"' KB",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "build",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}",
                "clientJsKb": "'"${client_js_kb}"'",
                "staticKb": "'"${static_kb}"'",
                "artifactKb": "'"${artifact_kb}"'"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send bundle size event to Dynatrace"

      - name: Track build timing
        if: success()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.job-start.outputs.start_time }}))
          echo "Build duration: ${duration} seconds"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: build",
              "description": "Application build and artifact creation completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: ${{ job.status }}",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "build",
                "duration": '"$duration"',
                "status": "${{ job.status }}",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send build timing event to Dynatrace"

  prepare-playwright-cache:
    name: Prepare Playwright browser cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Playwright browsers
        uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-playwright-

      - name: Prepare node and install dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Save Playwright browsers cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

  e2e-tests-shards:
    runs-on: ubuntu-latest
    needs: prepare-playwright-cache
    outputs:
      start-time: ${{ steps.job-start.outputs.start_time }}
    strategy:
      matrix:
        project: [category-tests, global-tests, search-tests, redirect-tests]
    name: E2E Tests / ${{ matrix.project }}
    env:
      E2E_TEST_USER_TOKEN: ${{ secrets.E2E_TEST_USER_TOKEN }}
      MERCHANDISING_API_APIGEE_KEY: ${{ secrets._MERCHANDISING_API_APIGEE_KEY }}
      MERCHANDISING_API_BASEURL: https://api-dev.marksandspencer.com/merchandising
      NEXTAUTH_URL: http://localhost:3000/api/auth
      NEXTAUTH_SECRET: ${{ secrets._NEXTAUTH_SECRET }}
      AZURE_AD_CLIENT_ID: ${{ secrets._AZURE_AD_CLIENT_ID }}
      AZURE_AD_TENANT_ID: ${{ secrets._AZURE_AD_TENANT_ID }}
      AZURE_AD_CLIENT_SECRET: ${{ secrets._AZURE_AD_CLIENT_SECRET }}
      NEXT_PUBLIC_AUTO_LOGIN: false
      DEBUG: 'pw:webserver'
    steps:
      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Playwright browsers
        uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-playwright-

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Build app
        run: pnpm run build

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

  end-to-end-tests:
    runs-on: ubuntu-latest
    needs: e2e-tests-shards
    if: always()
    name: E2E Tests
    steps:
      - name: Calculate E2E test duration and status
        id: e2e-summary
        run: |
          e2e_start_time=${{ needs.e2e-tests-shards.outputs.start-time }}

          end_time=$(date +%s)
          duration=$((end_time - e2e_start_time))

          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "E2E tests duration: ${duration} seconds"
          echo "E2E shard start time: $e2e_start_time"
          echo "E2E end time: $end_time"

      - name: Log E2E completion
        run: echo "All E2E shards finished"

      - name: Fail if any E2E shard did not succeed
        if: needs.e2e-tests-shards.result != 'success'
        run: |
          echo "e2e-tests-shards result was '${{ needs.e2e-tests-shards.result }}' (expected 'success')"
          exit 1

      - name: Track end-to-end-tests timing
        if: needs.e2e-tests-shards.result == 'success'
        run: |
          duration=${{ steps.e2e-summary.outputs.duration }}

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: end-to-end-tests",
              "description": "End-to-end Playwright tests completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: success",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "workflowName": "${{ github.workflow }}",
                "jobName": "end-to-end-tests",
                "duration": '"$duration"',
                "status": "success",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send end-to-end-tests timing event to Dynatrace"

  storybook-a11y:
    name: Storybook Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Fix Rollup native bindings
        run: pnpm add -D @rollup/rollup-linux-x64-gnu --ignore-workspace-root-check

      - name: Generate API code
        run: pnpm run codegen

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Install Playwright (for test-runner)
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Storybook and run accessibility tests
        run: |
          pnpm exec concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "pnpm exec http-server storybook-static --port 6006" \
            "wait-on http://localhost:6006 && pnpm run test-storybook"

      - name: Upload accessibility test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-accessibility-report
          path: |
            test-results.json
            coverage/
          retention-days: 30

      - name: Track storybook-a11y timing
        if: success()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.job-start.outputs.start_time }}))
          echo "Storybook accessibility tests duration: ${duration} seconds"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: storybook-a11y",
              "description": "Storybook accessibility tests completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: ${{ job.status }}",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "storybook-a11y",
                "duration": '"$duration"',
                "status": "${{ job.status }}",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send storybook-a11y timing event to Dynatrace"
  track-workflow-timing:
    name: Track Workflow Performance
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, build, end-to-end-tests, storybook-a11y]
    if: success()
    steps:
      - name: Calculate and send workflow metrics
        run: |
          # Use accurate workflow start time from first job
          workflow_start_epoch="${{ needs.code-quality.outputs.workflow-start-time }}"
          workflow_end_epoch=$(date +%s)
          duration=$((workflow_end_epoch - workflow_start_epoch))

          minutes=$(((duration % 3600) / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          echo "📊 Workflow Duration: ${duration} seconds (${minutes}m ${seconds}s)"

          # Determine overall workflow status
          if [[ "${{ needs.code-quality.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" || \
                "${{ needs.end-to-end-tests.result }}" == "failure" ]]; then
            workflow_status="failure"
          elif [[ "${{ needs.code-quality.result }}" == "cancelled" || \
                  "${{ needs.unit-tests.result }}" == "cancelled" || \
                  "${{ needs.build.result }}" == "cancelled" || \
                  "${{ needs.end-to-end-tests.result }}" == "cancelled" ]]; then
            workflow_status="cancelled"
          else
            workflow_status="success"
          fi

          echo "📈 Workflow Status: ${workflow_status}"

          # Send workflow completion event to Dynatrace
          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Completed: ${{ github.workflow }}",
              "description": "Complete PR validation workflow finished in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: '"$workflow_status"'",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "workflow": "${{ github.workflow }}",
                "jobName": "whole-workflow",
                "duration": '"$duration"',
                "status": "'"$workflow_status"'",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "actor": "${{ github.actor }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "codeQualityResult": "${{ needs.code-quality.result }}",
                "unitTestsResult": "${{ needs.unit-tests.result }}",
                "buildResult": "${{ needs.build.result }}",
                "e2eTestsResult": "${{ needs.end-to-end-tests.result }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "⚠️  Failed to send workflow completion event to Dynatrace"
            
          # Also send individual job statuses summary
          echo "📋 Job Results Summary:"
          echo "  - code-quality: ${{ needs.code-quality.result }}"
          echo "  - unit-tests: ${{ needs.unit-tests.result }}"
          echo "  - build: ${{ needs.build.result }}"
          echo "  - end-to-end-tests: ${{ needs.end-to-end-tests.result }}"
        env:
