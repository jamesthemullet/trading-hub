name: PR validate and deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - hotfix
permissions:
  issues: write
  pull-requests: write
  contents: read
  id-token: write

concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  DYNATRACE_URL: ${{ secrets.DYNATRACE_URL }}
  DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
  NEXT_PUBLIC_AUTO_LOGIN: false

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    outputs:
      workflow-start-time: ${{ steps.workflow-start.outputs.start_time }}
    steps:
      - name: Record workflow start time
        id: workflow-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ steps.get-versions-from-package-json.outputs.node-version }}
          cache: 'npm'

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Rebuild SWC bindings
        run: npm rebuild @swc/core

      - name: Check formatting
        run: npm run format:check

      - name: Codegen
        run: npm run codegen

      - name: Check typescript
        run: npm run ts-check

      - name: Lint
        run: npm run lint

      - name: Track job timing
        if: success()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.job-start.outputs.start_time }}))
          echo "Code quality job duration: ${duration} seconds"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: code-quality",
              "description": "Code quality checks completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: ${{ job.status }}",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "code-quality",
                "duration": '"$duration"',
                "status": "${{ job.status }}",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send code-quality timing event to Dynatrace"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Test
        run: npm run codegen && npm test --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master

      - name: Track unit-tests timing
        if: success()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.job-start.outputs.start_time }}))
          echo "Unit tests duration: ${duration} seconds"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: unit-tests",
              "description": "Unit tests and SonarCloud scan completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: ${{ job.status }}",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "unit-tests",
                "duration": '"$duration"',
                "status": "${{ job.status }}",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send unit-tests timing event to Dynatrace"

  build:
    name: Build and upload the app
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare node and install dependencies
        uses: ./.github/actions/prepare

      - name: Build
        run: npm run build

      - name: Zip all files for upload between jobs
        # IMPORTANT: .next is a hidden folder and will NOT be included in the zip unless we specify it
        run: |
          cd .next/standalone
          zip next.zip ./* .next -qr

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone/next.zip

      - name: Track build timing
        if: success()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.job-start.outputs.start_time }}))
          echo "Build duration: ${duration} seconds"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: build",
              "description": "Application build and artifact creation completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: ${{ job.status }}",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "build",
                "duration": '"$duration"',
                "status": "${{ job.status }}",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send build timing event to Dynatrace"

  comment-deployment-message:
    if: ${{ github.event_name == 'pull_request' }}
    name: Comment deployment message
    needs: deploy-pr-env
    runs-on: ubuntu-latest
    steps:
      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: Deploying PR environments

      - name: Create comment
        if: steps.find-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Deploying PR environments 🖌

            PR URLs follow the following format:
            ```
            https://${{ github.event.pull_request.number }}-[8-letter-app-hash].azurewebsites.net
            ```
            > [!NOTE]
            > 1. PR environments are destroyed overnight
            > 2. More info on PR URLs format (seen above) [here](https://onyx.engineering.mnscorp.net/how-to/pipelines/pr-envs.html#pr-url-naming-convention)

            | App | URL |
            | --- | --- |

  deploy-pr-env:
    name: Deploy PR Environment
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    needs: build
    environment:
      name: deveun
    steps:
      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - id: dynamic-env-name
        name: Get PR environment name
        uses: DigitalInnovation/brightcloud/.github/actions/get-app-name@feat/oidcn

      - name: Check if PR infra is deployed
        id: check-infra-deployed
        uses: nick-fields/retry@v3.0.2
        with:
          timeout_seconds: 60
          max_attempts: 10
          retry_wait_seconds: 30
          command: |
            set +e
            echo "infra_deployed=true" >> "$GITHUB_OUTPUT"
            curl -I https://${{ steps.dynamic-env-name.outputs.dynamic-env-name }}.azurewebsites.net
            EXITCODE=$?
            if [ "$EXITCODE" -eq "6" ]; then
              echo "infra_deployed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            set -e
            exit 0

      - name: Login via Azure CLI
        if: steps.check-infra-deployed.outputs.infra_deployed == 'true'
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets._AZURE_AD_CLIENT_ID }}
          tenant-id: ${{ secrets._AZURE_AD_TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
      - name: Download artifact
        if: steps.check-infra-deployed.outputs.infra_deployed == 'true'
        uses: actions/download-artifact@v5
        with:
          name: node-app

      - name: Deploy artifact to PR environment
        if: steps.check-infra-deployed.outputs.infra_deployed == 'true'
        uses: nick-fields/retry@v3.0.2
        with:
          timeout_seconds: 360
          max_attempts: 5
          retry_wait_seconds: 10
          command: |
            set -x
            resource_group_name=dev-${{ steps.dynamic-env-name.outputs.dynamic-env-name }}-v1-eun-layer3-rg
            app_name=${{ steps.dynamic-env-name.outputs.dynamic-env-name }}
            echo deploying $app_name to $resource_group_name
            az webapp deploy \
              --resource-group $resource_group_name \
              --name $app_name \
              --src-path ./next.zip --timeout 360 \
              --type zip \
              --async true

      - name: Find deployment comment
        if: ${{ steps.check-infra-deployed.outputs.infra_deployed == 'true' && github.event_name == 'pull_request' }}
        id: find-deployment-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: Deploying PR environments

      - name: Check if already includes URL
        if: ${{ steps.check-infra-deployed.outputs.infra_deployed == 'true' && github.event_name == 'pull_request' }}
        id: check-if-already-includes
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: ${{ steps.dynamic-env-name.outputs.dynamic-env-name }}

      - name: Update deployment comment
        if: |
          steps.check-infra-deployed.outputs.infra_deployed == 'true'
          && steps.find-deployment-comment.outputs.comment-id != ''
          && steps.check-if-already-includes.outputs.comment-id == ''
          && github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ steps.find-deployment-comment.outputs.comment-id }}
          body: |
            | `${{ steps.dynamic-env-name.outputs.dynamic-env-name }}` | https://${{ steps.dynamic-env-name.outputs.dynamic-env-name }}.azurewebsites.net |
          edit-mode: append

      - name: Update description
        uses: actions/github-script@v8
        env:
          INPUT_PR_NUMBER: ${{ github.event.number }}
        with:
          script: |
            const prNumber = process.env.INPUT_PR_NUMBER;    
            const currentPr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const currentPrBody = currentPr.data.body;
            const newPrBody = currentPrBody.replaceAll('http://localhost:3000', `https://${{ steps.dynamic-env-name.outputs.dynamic-env-name }}.azurewebsites.net`);
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newPrBody
            });

      - name: Delete zip file
        if: steps.check-infra-deployed.outputs.infra_deployed == 'true'
        run: rm next.zip

      - name: Cancel build due to failure
        if: ${{ failure() }}
        uses: andymckay/cancel-action@0.5

      - name: Track deploy-pr-env timing
        if: success()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.job-start.outputs.start_time }}))
          echo "Deploy PR env duration: ${duration} seconds"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: deploy-pr-env",
              "description": "PR environment deployment completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: ${{ job.status }}",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "jobName": "deploy-pr-env",
                "duration": '"$duration"',
                "status": "${{ job.status }}",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send deploy-pr-env timing event to Dynatrace"

  e2e-tests-shards:
    runs-on: ubuntu-latest
    needs: code-quality
    outputs:
      start-time: ${{ steps.job-start.outputs.start_time }}
    strategy:
      matrix:
        project: [category-tests, global-tests, search-tests, redirect-tests]
    name: E2E Tests / ${{ matrix.project }}
    env:
      E2E_TEST_USER_TOKEN: ${{ secrets.E2E_TEST_USER_TOKEN }}
      MERCHANDISING_API_APIGEE_KEY: ${{ secrets._MERCHANDISING_API_APIGEE_KEY }}
      MERCHANDISING_API_BASEURL: https://api-dev.marksandspencer.com/merchandising
      NEXTAUTH_URL: http://localhost:3000/api/auth
      NEXTAUTH_SECRET: ${{ secrets._NEXTAUTH_SECRET }}
      AZURE_AD_CLIENT_ID: ${{ secrets._AZURE_AD_CLIENT_ID }}
      AZURE_AD_TENANT_ID: ${{ secrets._AZURE_AD_TENANT_ID }}
      AZURE_AD_CLIENT_SECRET: ${{ secrets._AZURE_AD_CLIENT_SECRET }}
      NEXT_PUBLIC_AUTO_LOGIN: false
      DEBUG: 'pw:webserver'
    steps:
      - name: Record job start time
        id: job-start
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache Playwright browsers
        uses: actions/cache/restore@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

  end-to-end-tests:
    runs-on: ubuntu-latest
    needs: [e2e-tests-shards, code-quality]
    if: always()
    name: E2E Tests
    steps:
      - name: Calculate E2E test duration and status
        id: e2e-summary
        run: |
          e2e_start_time=${{ needs.e2e-tests-shards.outputs.start-time }}

          end_time=$(date +%s)
          duration=$((end_time - e2e_start_time))

          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "E2E tests duration: ${duration} seconds"
          echo "E2E shard start time: $e2e_start_time"
          echo "E2E end time: $end_time"

      - name: Log E2E completion
        run: echo "All E2E shards finished"

      - name: Track end-to-end-tests timing
        if: needs.e2e-tests-shards.result == 'success'
        run: |
          duration=${{ steps.e2e-summary.outputs.duration }}

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Job Completed: end-to-end-tests",
              "description": "End-to-end Playwright tests completed in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: success",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "workflowName": "${{ github.workflow }}",
                "jobName": "end-to-end-tests",
                "duration": '"$duration"',
                "status": "success",
                "workflow": "${{ github.workflow }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "Failed to send end-to-end-tests timing event to Dynatrace"

  track-workflow-timing:
    name: Track Workflow Performance
    runs-on: ubuntu-latest
    needs:
      [
        code-quality,
        unit-tests,
        build,
        comment-deployment-message,
        deploy-pr-env,
        end-to-end-tests,
      ]
    if: success()
    steps:
      - name: Calculate and send workflow metrics
        run: |
          # Use accurate workflow start time from first job
          workflow_start_epoch="${{ needs.code-quality.outputs.workflow-start-time }}"
          workflow_end_epoch=$(date +%s)
          duration=$((workflow_end_epoch - workflow_start_epoch))

          minutes=$(((duration % 3600) / 60))
          seconds=$((duration % 60))

          DYNATRACE_URL="${{ secrets.DYNATRACE_URL }}"
          DYNATRACE_API_TOKEN="${{ secrets.DYNATRACE_API_TOKEN }}"
          SERVICE_NAME="trading-hub"

          echo "📊 Workflow Duration: ${duration} seconds (${minutes}m ${seconds}s)"

          # Determine overall workflow status
          if [[ "${{ needs.code-quality.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" || \
                "${{ needs.deploy-pr-env.result }}" == "failure" || \
                "${{ needs.end-to-end-tests.result }}" == "failure" ]]; then
            workflow_status="failure"
          elif [[ "${{ needs.code-quality.result }}" == "cancelled" || \
                  "${{ needs.unit-tests.result }}" == "cancelled" || \
                  "${{ needs.build.result }}" == "cancelled" || \
                  "${{ needs.deploy-pr-env.result }}" == "cancelled" || \
                  "${{ needs.end-to-end-tests.result }}" == "cancelled" ]]; then
            workflow_status="cancelled"
          else
            workflow_status="success"
          fi

          echo "📈 Workflow Status: ${workflow_status}"

          # Send workflow completion event to Dynatrace
          curl -X POST "$DYNATRACE_URL/api/v2/events/ingest" \
            -H "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_ANNOTATION",
              "title": "GitHub Workflow Completed: ${{ github.workflow }}",
              "description": "Complete PR validation workflow finished in '"${minutes}m ${seconds}s"' ('"$duration"' seconds) with status: '"$workflow_status"'",
              "properties": {
                "serviceName": "'"$SERVICE_NAME"'",
                "workflow": "${{ github.workflow }}",
                "jobName": "whole-workflow",
                "duration": '"$duration"',
                "status": "'"$workflow_status"'",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "actor": "${{ github.actor }}",
                "runId": "${{ github.run_id }}",
                "prNumber": "${{ github.event.number }}",
                "codeQualityResult": "${{ needs.code-quality.result }}",
                "unitTestsResult": "${{ needs.unit-tests.result }}",
                "buildResult": "${{ needs.build.result }}",
                "deployResult": "${{ needs.deploy-pr-env.result }}",
                "e2eTestsResult": "${{ needs.end-to-end-tests.result }}"
              },
              "attachRules": {
                "tagRule": [
                  {
                    "meTypes": ["SERVICE"],
                    "tags": [
                      {
                        "key": "service",
                        "value": "'"$SERVICE_NAME"'"
                      },
                      {
                        "key": "environment",
                        "value": "dev"
                      }
                    ]
                  }
                ]
              }
            }' || echo "⚠️  Failed to send workflow completion event to Dynatrace"
            
          # Also send individual job statuses summary
          echo "📋 Job Results Summary:"
          echo "  - code-quality: ${{ needs.code-quality.result }}"
