name: PR validate and deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }} @ ${{ github.ref }}'

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get versions from package.json
        id: get-versions-from-package-json
        shell: bash
        run: |
          set -x
          NODE_VERSION=$(jq -r '.engines.node' < package.json)
          echo "node-version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4.0.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '10'
        with:
          node-version: ${{ steps.get-versions-from-package-json.outputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check for outdated dependencies
        run: npm outdated

      - name: Check formatting
        run: npm run format:check

      - name: Check typescript
        run: npm run ts-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Zip all files for upload between jobs
        # IMPORTANT: .next is a hidden folder and will NOT be included in the zip unless we specify it
        run: |
          cd .next/standalone
          zip next.zip ./* .next -qr

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone/next.zip

  deploy-pr-env:
    name: Deploy PR Environment
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: dynamic-env-name
        name: Get PR environment name
        uses: DigitalInnovation/brightcloud/.github/actions/get-app-name@feat/oidcn

      - name: Check if PR infra is deployed
        id: check-infra-deployed
        uses: nick-fields/retry@v2.8.3
        with:
          timeout_seconds: 60
          max_attempts: 10
          retry_wait_seconds: 10
          command: |
            set +e
            echo "infra_deployed=true" >> "$GITHUB_OUTPUT"
            curl -I https://${{ steps.dynamic-env-name.outputs.dynamic-env-name }}.azurewebsites.net
            EXITCODE=$?
            if [ "$EXITCODE" -eq "6" ]; then
              echo "infra_deployed=false" >> "$GITHUB_OUTPUT"
            fi
            set -e
            exit 0

      - name: Login via Azure CLI
        if: steps.check-infra-deployed.outputs.infra_deployed == 'true'
        uses: azure/login@v1.6.1
        with:
          creds: '{"clientId": "${{ secrets.SP_CLIENT_ID }}", "clientSecret": "${{ secrets.SP_PASSWORD }}", "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}", "tenantId": "bd5c6713-7399-4b31-be79-78f2d078e543"}'

      - name: Download artifact from code-quality job
        if: steps.check-infra-deployed.outputs.infra_deployed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy artifact to PR environment
        shell: bash
        run: |
          set -x
          echo "Deploying to ${{ steps.dynamic-env-name.outputs.dynamic-env-name }}"

      - name: Delete zip file
        run: rm next.zip
