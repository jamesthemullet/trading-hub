name: pr-destroy-expired-ttl

env:
  GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
  BRIGHTCLOUD_REF: main

permissions:
  pull-requests: read
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

on:
  schedule:
    # Runs "every quarter hour"
    - cron: '*/15 * * * *'
jobs:  
  check-vars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Check composite parameter for the reusable pipeline
        id : check-composite-vars
        uses: DigitalInnovation/brightcloud/.github/actions/check-layer-runtime-type@feat/oidcn
    outputs:
      oidc: ${{ steps.check-composite-vars.outputs.oidc}}

  kill-leaked-env:
    runs-on: ubuntu-latest
    environment:
      name: deveun
    needs:
      - check-vars
    steps:
      - uses: actions/github-script@v6
        id: open-prs
        with:
          script: |
            const query = `query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name){
                pullRequests(states: OPEN, first: 100) {
                  nodes {
                    number
                  }
                }
              }
            }`;
            const variables = {
              owner: context.repo.owner,
              name: context.repo.repo,
            }
            const result = (await github.graphql(query, variables)).repository.pullRequests.nodes
            console.log(result)
            return result
      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.SP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
      - uses: actions/checkout@v3
      - id: pr-suffix
        run: |
          APP_NAME=$(cat ci/infra/terraform/vars/common.tfvars | grep deploy_app_name | tr -d " " | cut -d= -f2 | tr -d '"')
          SUFFIX="-$(echo $APP_NAME | md5sum | cut -c1-8)-v1-eun-layer3-rg"
          echo "value=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Kill leaked
        uses: azure/CLI@v1
        with:
          inlineScript: |
            OPEN_PRS=`echo '${{ steps.open-prs.outputs.result }}' | jq  --raw-output '.[].number | "dev-pr-\( . )${{ steps.pr-suffix.outputs.value }}"'`
            echo "OPEN PRS: $OPEN_PRS"
            ALL_PRS=`az group list --query "[?starts_with(name,'dev-pr-')].name" -otsv`
            echo "ALL PRS: $ALL_PRS"
            LEAKED_PRS=`printf "%s\n" "${ALL_PRS[@]}" "${OPEN_PRS[@]}" | sort | uniq -u`
            for i in ${LEAKED_PRS}; do
            if [ $(az group exists --name $i) = true ]; then
              echo "Deleting the Leaked PR: $i"
              az group delete --yes --no-wait -n $i
            fi
            done
          
  kill-expired-env:
    runs-on: ubuntu-latest
    environment:
      name: deveun
    needs:
      - check-vars
    name: destroy-expired
    steps:
      - name: Checkout-local-repo
        uses: actions/checkout@v3
      - id: dynamic-env-destroy-oidc
        if: ${{ needs.check-vars.outputs.oidc == 'true' }}
        uses: DigitalInnovation/brightcloud/.github/actions/webapp-dynamic-env-housekeeping-oidc@feat/oidcn
        with:
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
          BRIGHTCLOUD_REF: ${{ env.BRIGHTCLOUD_REF }}
      - id: dynamic-env-destroy
        if: ${{ needs.check-vars.outputs.oidc != 'true' }}
        uses: DigitalInnovation/brightcloud/.github/actions/webapp-dynamic-env-housekeeping@main
        with:
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_PASSWORD: ${{ secrets.SP_PASSWORD }}
          SAML_GITHUB_TOKEN: ${{ secrets.SAML_GITHUB_TOKEN }}
          BRIGHTCLOUD_REF: ${{ env.BRIGHTCLOUD_REF }}
