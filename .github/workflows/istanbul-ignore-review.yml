name: Istanbul Ignore Review

# Runs every morning, regardless of how many review PRs/issues from previous
# runs are still open, and hands the next single istanbul ignore statement
# from istanbul-ignore-files.md to GitHub Copilot coding agent for review.
#
# Requires a repository secret `COPILOT_ASSIGN_TOKEN`: a personal access
# token (classic `repo` scope, or fine-grained with read access to metadata
# and read/write access to actions, contents, issues and pull requests)
# belonging to a user with a Copilot coding agent license. The default
# `GITHUB_TOKEN` cannot be used because Copilot issue-assignment requires a
# user token, not a server-to-server token.
on:
  schedule:
    # 09:22 UTC, every day
    - cron: '22 9 * * *'
  workflow_dispatch: {}

env:
  TRACKING_LABEL: istanbul-ignore-review
  TRACKING_FILE: istanbul-ignore-files.md

jobs:
  create-review-task:
    name: Assign next ignore statement to Copilot
    runs-on: ubuntu-latest
    steps:
      - name: Ensure tracking label exists
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          gh label create "$TRACKING_LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --color BFD4F2 \
            --description "Automated istanbul ignore review batches" \
            || true

      - name: Create review issue
        id: create-issue
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          body=$(cat <<EOF
          This is an automated task. Work only from \`$TRACKING_FILE\`.

          1. Find the first line in \`$TRACKING_FILE\` that is **not** marked done (lines starting with \`- [ ]\`), reading top to bottom. Each line ends with a count in parentheses, e.g. \`(3)\`, showing how many \`/* istanbul ignore ... */\` / \`// istanbul ignore ...\` comments remain in that file.
          2. In that file, review only the **first** remaining istanbul ignore comment (top to bottom). Do not review more than one ignore statement in total, even if the file has more.
             - If the ignored branch/line can be tested, remove the ignore comment and add a test that exercises it. Run \`pnpm run test\` to confirm 100% coverage is maintained.
             - If it genuinely cannot be tested, keep the ignore comment and add a short comment directly above it explaining why (only if one isn't already present).
          3. Update the line for that file in \`$TRACKING_FILE\`:
             - Decrement the count in parentheses by 1.
             - If the count reaches 0, change the line's \`- [ ]\` to \`- [x]\`.
          4. Run \`pnpm run lint\`, \`pnpm run ts-check\`, and \`pnpm run test\` before finishing, and fix any failures caused by your changes.
          5. Open a pull request with your changes.

          Do not touch any files other than the one containing the single ignore statement you reviewed, plus \`$TRACKING_FILE\` and any new/modified test files.
          EOF
          )

          issue_url=$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Istanbul ignore review - $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "$TRACKING_LABEL" \
            --body "$body")

          issue_number=$(basename "$issue_url")
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Assign issue to Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/issues/${{ steps.create-issue.outputs.issue_number }}/assignees" \
            --input - <<< '{"assignees": ["copilot-swe-agent[bot]"]}'
