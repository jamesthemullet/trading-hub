name: Sync API schema

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Sync search-merchandising.yml and regenerate types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout search-service
        uses: actions/checkout@v7
        with:
          repository: DigitalInnovation/search-service
          ref: develop
          token: ${{ secrets.SEARCH_SERVICE_PAT }}
          sparse-checkout: search-service-app/src/main/resources/static/search-merchandising.yml
          sparse-checkout-cone-mode: false
          path: search-service

      - name: Copy API schema
        run: |
          cp search-service/search-service-app/src/main/resources/static/search-merchandising.yml src/libs/api/api.yml
          rm -rf search-service

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/libs/api/api.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare node and install dependencies
        if: steps.diff.outputs.changed == 'true'
        uses: ./.github/actions/prepare

      - name: Regenerate TypeScript client
        if: steps.diff.outputs.changed == 'true'
        run: pnpm run codegen

      - name: Format generated files
        if: steps.diff.outputs.changed == 'true'
        run: pnpm run format

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ github.workspace }}
          sign-commits: true
          branch: chore/sync-api-schema-${{ github.run_id }}
          commit-message: 'chore: sync API schema from search-service'
          title: 'chore: sync API schema from search-service'
          body: |
            Automated sync of `src/libs/api/api.yml` from the [search-service](https://github.com/DigitalInnovation/search-service/blob/develop/search-service-app/src/main/resources/static/search-merchandising.yml).

            TypeScript client has been regenerated via `pnpm run codegen`.

            Please review the diff and merge if the changes look correct.
          labels: dependencies
          delete-branch: true

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Sync API schema workflow failed',
              body: `Workflow run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug']
            })
