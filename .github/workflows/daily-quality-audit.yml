name: Daily quality audit

on:
  schedule:
    - cron: '0 9 * * 1-5' # 9am UTC Mon-Fri https://crontab.guru/#0_9_*_*_1-5
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  trigger-quality-audit:
    name: Open Copilot quality audit issue
    runs-on: ubuntu-latest
    steps:
      - name: Create issue and assign to Copilot
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Daily quality audit $(date +%Y-%m-%d)" \
            --label "quality" \
            --assignee "copilot" \
            --body "/quality skill"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
